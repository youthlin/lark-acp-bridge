version: "1.0"
name: gitee-ci
displayName: gitee-ci
stages:
- name: Test
  displayName: 测试
  strategy: naturally
  trigger: auto
  steps:
  - step: ut@golang
    name: ""
    displayName: Golang 单元测试
    golangVersion: "1.24"
    commands:
    - '# 默认使用goproxy.cn用户可手动调整'
    - export GOPROXY=https://goproxy.cn
    - '# 默认的单元测试命令'
    - '# 输出测试报告目录到当前工作目录，可自动上传并展示'
    - mkdir -p golang-report
    - '# 未使用Go Mod的用户需要打开一下注释'
    - '# export GOFLAGS=-mod=vendor'
    - curl -fsSL -o /tmp/go.tgz https://golang.google.cn/dl/go1.24.10.linux-amd64.tar.gz
    - rm -rf /tmp/go && tar -C /tmp -xzf /tmp/go.tgz
    - export GOROOT=/tmp/go PATH=/tmp/go/bin:$PATH
    - go version
    - CGO_ENABLED=0 go test -v -json -cover -coverprofile cover.out ./... > golang-report/report.jsonl
    - go tool cover -html=cover.out -o golang-report/index.html
    report:
      path: golang-report
      file: report.jsonl
      index: index.html
    checkpoints:
      key: TestPassRate
      relationalOperator: '>='
      value: "0"
      logicalOperator: '&&'
    caches:
    - /go/pkg/mod
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
- name: Build
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@golang
    name: ""
    displayName: Golang 构建
    golangVersion: "1.24"
    commands:
    - '# 默认使用goproxy.cn'
    - export GOPROXY=https://goproxy.cn
    - '# 输入你的构建命令'
    - curl -fsSL -o /tmp/go.tgz https://golang.google.cn/dl/go1.24.10.linux-amd64.tar.gz
    - rm -rf /tmp/go && tar -C /tmp -xzf /tmp/go.tgz
    - export GOROOT=/tmp/go PATH=/tmp/go/bin:$PATH
    - go version
    - CGO_ENABLED=0 go build -o output/lark-acp-bridge ./cmd/lark-acp-bridge
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./output
      type: .tar.gz
    caches:
    - /go/pkg/mod
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  trigger: auto
  push:
    branches:
      include:
      - main
notify: []
strategy:
  blocking: true
  cloneDepth: 1
